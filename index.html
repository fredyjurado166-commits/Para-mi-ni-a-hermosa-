
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para mi cielo 💙</title>

<style>

/* ==================================================
   GENERAL
================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

}

body {

    font-family: Arial, sans-serif;

    overflow: hidden;

    text-align: center;

    color: white;

    background: #8ed8ff;

}


/* ==================================================
   CIELO
================================================== */

.cielo {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 50vh;

    overflow: hidden;

    z-index: 1;

    background:

        linear-gradient(
            to bottom,
            #78cdf7 0%,
            #a9e3ff 45%,
            #dff7ff 100%
        );

    transition:
        height 4s ease-in-out;

}


/* ==================================================
   NUBES
================================================== */

.nube {

    position: absolute;

    font-size: 50px;

    opacity: .85;

    animation:
        flotar
        5s
        infinite
        alternate
        ease-in-out;

}

.nube1 {

    top: 35px;
    left: 5%;

}

.nube2 {

    top: 90px;
    right: 8%;

    animation-delay: 1s;

}

.nube3 {

    top: 170px;
    left: 40%;

    font-size: 35px;

    animation-delay: 2s;

}


@keyframes flotar {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(18px);
    }

}


/* ==================================================
   MAR
================================================== */

.mar {

    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 50vh;

    overflow: hidden;

    background:

        linear-gradient(
            to bottom,
            #159bd7 0%,
            #087fbd 35%,
            #05649b 70%,
            #034d78 100%
        );

    z-index: 2;

    transition:
        height 4s ease-in-out;

}


/* ==================================================
   LUZ DEL AGUA
================================================== */

.mar::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            ellipse at 20% 5%,
            rgba(255,255,255,.20),
            transparent 35%
        ),

        radial-gradient(
            ellipse at 75% 10%,
            rgba(255,255,255,.15),
            transparent 35%
        );

    pointer-events: none;

    z-index: 1;

}


/* ==================================================
   SUPERFICIE DEL AGUA
================================================== */

.superficie {

    position: absolute;

    top: -9px;
    left: -5%;

    width: 110%;
    height: 25px;

    border-radius: 50%;

    background:

        linear-gradient(
            to bottom,
            rgba(220,250,255,.95),
            rgba(80,205,245,.8)
        );

    box-shadow:

        0 5px 18px
        rgba(255,255,255,.45);

    animation:
        oleaje
        4s
        infinite
        ease-in-out;

    z-index: 20;

}


@keyframes oleaje {

    0% {
        transform:
            translateX(-2%)
            scaleY(1);
    }

    50% {
        transform:
            translateX(2%)
            scaleY(1.25);
    }

    100% {
        transform:
            translateX(-2%)
            scaleY(1);
    }

}


/* ==================================================
   ANIMALES
================================================== */

.animal-mar {

    position: absolute;

    z-index: 8;

    object-fit: contain;

    pointer-events: none;

    user-select: none;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,.22)
        );

}


/* MANTARRAYA 1 */

.animal1 {

    width: 135px;

    left: 7%;
    top: 20%;

    animation:
        manta1
        5s
        infinite
        ease-in-out;

}


/* TIBURÓN 1 */

.animal2 {

    width: 150px;

    right: 7%;
    top: 40%;

    animation:
        tiburon1
        6s
        infinite
        ease-in-out;

}


/* MANTARRAYA 2 */

.animal3 {

    width: 115px;

    left: 42%;
    top: 58%;

    animation:
        manta2
        5.5s
        infinite
        ease-in-out;

}


/* MANTARRAYA 3 */

.animal4 {

    width: 125px;

    right: 28%;
    top: 15%;

    animation:
        manta3
        7s
        infinite
        ease-in-out;

}


/* TIBURÓN 2 */

.animal5 {

    width: 105px;

    left: 70%;
    top: 68%;

    animation:
        tiburon2
        4.5s
        infinite
        ease-in-out;

}


/* ==================================================
   MOVIMIENTOS
================================================== */

@keyframes manta1 {

    0% {
        transform:
            translate(0,0)
            rotate(-3deg);
    }

    25% {
        transform:
            translate(12px,-7px)
            rotate(2deg);
    }

    50% {
        transform:
            translate(3px,7px)
            rotate(-2deg);
    }

    75% {
        transform:
            translate(-10px,-4px)
            rotate(2deg);
    }

    100% {
        transform:
            translate(0,0)
            rotate(-3deg);
    }

}


@keyframes tiburon1 {

    0% {
        transform:
            translate(0,0)
            rotate(1deg);
    }

    50% {
        transform:
            translate(-15px,8px)
            rotate(-3deg);
    }

    100% {
        transform:
            translate(0,0)
            rotate(1deg);
    }

}


@keyframes manta2 {

    0% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-12px)
            rotate(4deg);
    }

    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

}


@keyframes manta3 {

    0% {
        transform:
            translate(0,0)
            rotate(-2deg);
    }

    50% {
        transform:
            translate(10px,-8px)
            rotate(3deg);
    }

    100% {
        transform:
            translate(0,0)
            rotate(-2deg);
    }

}


@keyframes tiburon2 {

    0% {
        transform:
            translate(0,0)
            rotate(-3deg);
    }

    50% {
        transform:
            translate(-18px,7px)
            rotate(3deg);
    }

    100% {
        transform:
            translate(0,0)
            rotate(-3deg);
    }

}


/* ==================================================
   ALETA DEL TIBURÓN
================================================== */

.aleta {

    position: absolute;

    left: -140px;

    top: 35%;

    width: 115px;
    height: 90px;

    z-index: 15;

    animation:
        nadar
        11s
        infinite
        linear;

}


.aleta::before {

    content: "";

    position: absolute;

    left: 28px;
    bottom: 10px;

    width: 50px;
    height: 68px;

    background:

        linear-gradient(
            110deg,
            #082c42 0%,
            #155873 45%,
            #061f31 100%
        );

    clip-path:

        polygon(
            0% 100%,
            20% 70%,
            38% 45%,
            54% 12%,
            67% 0%,
            72% 15%,
            74% 38%,
            84% 68%,
            100% 100%
        );

    filter:

        drop-shadow(
            4px 6px 3px
            rgba(0,0,0,.28)
        );

}


.aleta::after {

    content: "";

    position: absolute;

    left: 46px;
    bottom: 35px;

    width: 6px;
    height: 40px;

    background:

        linear-gradient(
            to bottom,
            rgba(255,255,255,.28),
            transparent
        );

    border-radius: 50%;

    transform:
        rotate(20deg);

}


/* ==================================================
   ESTELA
================================================== */

.aleta-estela {

    position: absolute;

    left: -150px;

    top: 43%;

    width: 100px;
    height: 14px;

    border-radius: 50%;

    background:

        radial-gradient(
            ellipse,
            rgba(210,250,255,.55),
            rgba(100,210,240,.15),
            transparent 70%
        );

    filter: blur(2px);

    z-index: 13;

    animation:
        estela
        11s
        infinite
        linear;

}


@keyframes estela {

    0% {

        left: -160px;

        opacity: 0;

        transform:
            scaleX(.5);

    }

    15% {

        opacity: .65;

    }

    50% {

        opacity: .35;

        transform:
            scaleX(1.4);

    }

    100% {

        left: 110%;

        opacity: 0;

        transform:
            scaleX(.7);

    }

}


/* ==================================================
   MOVIMIENTO ALETA
================================================== */

@keyframes nadar {

    0% {

        left: -140px;

        transform:
            translateY(0)
            rotate(-2deg);

    }

    15% {

        transform:
            translateY(-7px)
            rotate(1deg);

    }

    30% {

        transform:
            translateY(4px)
            rotate(-1deg);

    }

    45% {

        transform:
            translateY(-6px)
            rotate(2deg);

    }

    60% {

        transform:
            translateY(5px)
            rotate(-2deg);

    }

    75% {

        transform:
            translateY(-4px)
            rotate(1deg);

    }

    100% {

        left: 110%;

        transform:
            translateY(0)
            rotate(-2deg);

    }

}


/* ==================================================
   BURBUJAS
================================================== */

.burbuja {

    position: absolute;

    bottom: -30px;

    width: 10px;
    height: 10px;

    border:
        2px solid
        rgba(255,255,255,.6);

    border-radius: 50%;

    animation:
        subirBurbuja
        7s
        infinite
        ease-in;

    z-index: 10;

}


.burbuja1 {

    left: 15%;

    animation-delay: 1s;

}


.burbuja2 {

    left: 35%;

    width: 7px;
    height: 7px;

    animation-delay: 3s;

}


.burbuja3 {

    left: 65%;

    width: 13px;
    height: 13px;

}


.burbuja4 {

    left: 85%;

    width: 6px;
    height: 6px;

    animation-delay: 4s;

}


@keyframes subirBurbuja {

    0% {

        transform:
            translateY(0);

        opacity: 0;

    }

    20% {

        opacity: .8;

    }

    100% {

        transform:
            translateY(-55vh);

        opacity: 0;

    }

}


/* ==================================================
   ALGAS
================================================== */

.alga {

    position: absolute;

    bottom: 0;

    width: 12px;
    height: 90px;

    background:

        linear-gradient(
            to right,
            #075c42,
            #0b8a60,
            #064d39
        );

    border-radius:
        50% 50% 0 0;

    transform-origin:
        bottom;

    animation:
        algaMovimiento
        3s
        infinite
        ease-in-out;

    z-index: 9;

}


.alga1 {

    left: 10%;

    height: 80px;

}


.alga2 {

    left: 18%;

    height: 120px;

    animation-delay: 1s;

}


.alga3 {

    right: 15%;

    height: 100px;

    animation-delay: .5s;

}


.alga4 {

    right: 8%;

    height: 70px;

    animation-delay: 1.5s;

}


@keyframes algaMovimiento {

    0% {
        transform: rotate(-5deg);
    }

    50% {
        transform: rotate(8deg);
    }

    100% {
        transform: rotate(-5deg);
    }

}


/* ==================================================
   GLOBO DE CANTOYA
================================================== */

.globo-cantoya {

    position: absolute;

    left: -220px;

    top: 12%;

    width: 170px;

    z-index: 25;

    opacity: 0;

    pointer-events: none;

}


/* ==================================================
   MOVIMIENTO DEL GLOBO
================================================== */

.globo-volando {

    animation:
        globoAvanza
        18s
        ease-in-out
        forwards;

}


@keyframes globoAvanza {

    0% {

        left: -220px;

        opacity: 0;

        transform:
            translateY(20px);

    }

    10% {

        opacity: 1;

    }

    50% {

        transform:
            translateY(-8px);

    }

    100% {

        left: 72%;

        opacity: 1;

        transform:
            translateY(5px);

    }

}


/* ==================================================
   CINAMORROL
================================================== */

.cinamorrol {

    position: absolute;

    left: 32%;

    top: -20px;

    width: 75px;

    z-index: 26;

    opacity: 0;

    pointer-events: none;

}


/* ==================================================
   CAÍDA DEL CINAMORROL
================================================== */

.cinamorrol-cayendo {

    animation:
        cinamorrolCae
        16s
        ease-in-out
        forwards;

}


@keyframes cinamorrolCae {

    0% {

        opacity: 0;

        transform:
            translateY(-40px)
            rotate(-5deg);

    }

    10% {

        opacity: 1;

    }

    30% {

        transform:
            translateY(70px)
            rotate(5deg);

    }

    55% {

        transform:
            translateY(150px)
            rotate(-4deg);

    }

    75% {

        transform:
            translateY(240px)
            rotate(4deg);

    }

    100% {

        opacity: 1;

        transform:
            translateY(330px)
            rotate(-3deg);

    }

}


/* ==================================================
   PANTALLA PRINCIPAL
================================================== */

.contenedor {

    position: relative;

    z-index: 30;

    margin: auto;

    padding-top: 15vh;

    width: 90%;

    max-width: 700px;

    animation:
        aparecer
        2s
        ease;

}


@keyframes aparecer {

    from {

        opacity: 0;

        transform:
            scale(.7);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* ==================================================
   TÍTULO
================================================== */

h1 {

    color: white;

    text-shadow:

        0 3px 8px
        rgba(40,120,170,.35);

}


/* ==================================================
   TEXTO
================================================== */

p {

    color: white;

    font-size: 18px;

    text-shadow:

        0 2px 5px
        rgba(0,0,0,.15);

}


/* ==================================================
   BOTONES
================================================== */

button {

    background:
        #8ed8ff;

    border: none;

    padding:
        15px 30px;

    margin:
        10px;

    border-radius:
        30px;

    font-size:
        18px;

    color:
        white;

    cursor:
        pointer;

    box-shadow:

        0 5px 15px
        rgba(80,180,230,.45);

    transition:

        transform .3s,
        background .3s;

}


button:hover {

    transform:
        scale(1.1);

    background:
        #65c7f5;

}


/* ==================================================
   MENÚ
================================================== */

.menu {

    display: none;

    position: relative;

    z-index: 30;

    padding-top: 15vh;

    width: 90%;

    max-width: 700px;

    margin: auto;

}


/* ==================================================
   ANIMACIÓN AL PRESIONAR SÍ
================================================== */

body.sorpresa .cielo {

    height: 90vh;

}


body.sorpresa .mar {

    height: 10vh;

}


/* Los animales se esconden suavemente */

body.sorpresa .animal-mar,
body.sorpresa .aleta,
body.sorpresa .aleta-estela,
body.sorpresa .burbuja,
body.sorpresa .alga,
body.sorpresa .superficie {

    opacity: 0;

    transition:
        opacity 1s ease;

}


/* El globo aparece */

body.sorpresa .globo-cantoya {

    opacity: 1;

}


/* ==================================================
   RESPONSIVE
================================================== */

@media (max-width: 600px) {

    h1 {
        font-size: 28px;
    }

    p {
        font-size: 16px;
    }

    button {

        font-size: 16px;

        padding:
            12px 24px;

    }

    .nube {

        font-size: 38px;

    }

    .animal1 {

        width: 90px;

    }

    .animal2 {

        width: 105px;

    }

    .animal3 {

        width: 80px;

    }

    .animal4 {

        width: 90px;

    }

    .animal5 {

        width: 75px;

    }

    .globo-cantoya {

        width: 120px;

    }

    .cinamorrol {

        width: 55px;

    }

}


/* ==================================================
   MENSAJE
================================================== */

#mensaje {

    color: white;

}

</style>

</head>


<body>


<!-- ==================================================
     CIELO
================================================== -->

<div class="cielo">

    <div class="nube nube1">
        ☁️
    </div>

    <div class="nube nube2">
        ☁️
    </div>

    <div class="nube nube3">
        ☁️
    </div>

</div>


<!-- ==================================================
     PANTALLA INICIAL
================================================== -->

<div class="contenedor" id="inicio">

    <h1>
        💗 Para mi cielo 💗
    </h1>

    <p>
        ¿Quieres ver lo que preparé para ti? :3 ☁️
    </p>

    <button onclick="entrar()">
        Sí 💗
    </button>

    <button onclick="no()">
        No 💔
    </button>

    <p id="mensaje"></p>

</div>


<!-- ==================================================
     MENÚ
================================================== -->

<div class="menu" id="menu">

    <h1>
        Bienvenida, mi niña hermosa 💗
    </h1>

    <p>
        Escoge un apartado :3 💗
    </p>

    <button>
        💌 Carta para ti
    </button>

    <button>
        🎵 Canciones
    </button>

    <button>
        📸 Nuestros momentos
    </button>

    <button>
        💗 Carta final
    </button>

</div>


<!-- ==================================================
     MAR
================================================== -->

<div class="mar">


    <!-- MANTARRAYA 1 -->

    <img
        src="imagenes/ai-generated-silhouette-stingray-animal-black-color-only-full-body-vector-removebg-preview.png"
        class="animal-mar animal1"
        alt="Mantarraya"
    >


    <!-- TIBURÓN 1 -->

    <img
        src="imagenes/shark_PNG18832.png"
        class="animal-mar animal2"
        alt="Tiburón"
    >


    <!-- MANTARRAYA 2 -->

    <img
        src="imagenes/stingray-marine-life-animal-free-png.webp"
        class="animal-mar animal3"
        alt="Mantarraya"
    >


    <!-- MANTARRAYA 3 -->

    <img
        src="imagenes/ai-generated-silhouette-stingray-animal-black-color-only-full-body-vector-removebg-preview.png"
        class="animal-mar animal4"
        alt="Mantarraya"
    >


    <!-- TIBURÓN 2 -->

    <img
        src="imagenes/sweet-cute-simple-shark-clipart-vector-removebg-preview (1).png"
        class="animal-mar animal5"
        alt="Tiburón"
    >


    <!-- SUPERFICIE -->

    <div class="superficie"></div>


    <!-- ALETA -->

    <div class="aleta"></div>

    <div class="aleta-estela"></div>


    <!-- BURBUJAS -->

    <div class="burbuja burbuja1"></div>

    <div class="burbuja burbuja2"></div>

    <div class="burbuja burbuja3"></div>

    <div class="burbuja burbuja4"></div>


    <!-- ALGAS -->

    <div class="alga alga1"></div>

    <div class="alga alga2"></div>

    <div class="alga alga3"></div>

    <div class="alga alga4"></div>

</div>


<!-- ==================================================
     GLOBO DE CANTOYA
================================================== -->

<img
    src="imagenes/pngtree-comicstyle-hot-air-balloon-icon-on-white-background-vector-png-image_49384422-removebg-preview (1).png"
    class="globo-cantoya"
    id="globo"
    alt="Globo de cantoya"
>


<!-- ==================================================
     CINAMORROL
================================================== -->

<img
    src="imagenes/giphy_s (1).gif"
    class="cinamorrol"
    id="cinamorrol"
    alt="Cinamorrol"
>


<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script>


function entrar() {


    /* ================================================
       ACTIVAMOS LA GRAN ANIMACIÓN
    ================================================= */

    document.body.classList.add("sorpresa");


    /* ================================================
       DESAPARECE LA PANTALLA INICIAL
    ================================================= */

    setTimeout(function() {

        document
            .getElementById("inicio")
            .style.display = "none";

    }, 1800);


    /* ================================================
       APARECE EL GLOBO
    ================================================= */

    setTimeout(function() {

        document
            .getElementById("globo")
            .classList.add("globo-volando");

    }, 1200);


    /* ================================================
       CINAMORROL
    ================================================= */

    setTimeout(function() {

        document
            .getElementById("cinamorrol")
            .classList.add("cinamorrol-cayendo");

    }, 2200);


    /* ================================================
       APARECE EL MENÚ DESPUÉS
    ================================================= */

    setTimeout(function() {

        document
            .getElementById("menu")
            .style.display = "block";

    }, 4500);

}


/* ==================================================
   BOTÓN NO
================================================== */

function no() {

    document
        .getElementById("mensaje")
        .innerHTML =

        "Ándale será bonito 💙<br>" +

        "<button onclick='entrar()'>" +

        "Ver sorpresa ☁️" +

        "</button>";

}


</script>


</body>

</html>
