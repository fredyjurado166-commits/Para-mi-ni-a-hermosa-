<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para mi cielo 💙</title>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
    color: #4a90c2;

    background: linear-gradient(
        to bottom,
        #8ed8ff 0%,
        #bde9ff 30%,
        #dff7ff 50%,
        #55c7ff 100%
    );
}


/* =====================================================
   CIELO
===================================================== */

.cielo {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 52vh;

    overflow: hidden;

    z-index: 1;
}


/* NUBES */

.nube {
    position: absolute;

    font-size: 50px;
    opacity: 0.85;

    animation: flotar 5s infinite alternate ease-in-out;
}

.nube1 {
    top: 35px;
    left: 5%;
}

.nube2 {
    top: 90px;
    right: 8%;

    animation-delay: 1s;
}

.nube3 {
    top: 180px;
    left: 35%;

    font-size: 35px;

    animation-delay: 2s;
}


@keyframes flotar {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(18px);
    }

}


/* =====================================================
   MAR
===================================================== */

.mar {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 52vh;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #159bd7 0%,
            #087fbd 35%,
            #05649b 70%,
            #034d78 100%
        );

    z-index: 2;
}


/* =====================================================
   LUZ DENTRO DEL AGUA
===================================================== */

.mar::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background:
        radial-gradient(
            ellipse at 20% 10%,
            rgba(255,255,255,0.18),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 75% 20%,
            rgba(255,255,255,0.12),
            transparent 35%
        );

    pointer-events: none;

    z-index: 1;
}


/* =====================================================
   ANIMALES DEL MAR
===================================================== */

.animal-mar {

    position: absolute;

    z-index: 5;

    object-fit: contain;

    pointer-events: none;

    user-select: none;

    filter:
        drop-shadow(0 5px 5px rgba(0,0,0,0.22));
}


/* MANTARRAYA 1 */

.animal1 {

    width: 130px;

    left: 7%;
    top: 22%;

    animation:
        nadarAnimal1
        5s
        infinite
        ease-in-out;
}


/* TIBURÓN 1 */

.animal2 {

    width: 150px;

    right: 7%;
    top: 42%;

    animation:
        nadarAnimal2
        6s
        infinite
        ease-in-out;
}


/* MANTARRAYA 2 */

.animal3 {

    width: 115px;

    left: 40%;
    top: 57%;

    animation:
        nadarAnimal3
        5.5s
        infinite
        ease-in-out;
}


/* TIBURÓN 2 */

.animal4 {

    width: 140px;

    right: 28%;
    top: 15%;

    animation:
        nadarAnimal4
        7s
        infinite
        ease-in-out;
}


/* TIBURÓN / PEZ 3 */

.animal5 {

    width: 100px;

    left: 70%;
    top: 68%;

    animation:
        nadarAnimal5
        4.5s
        infinite
        ease-in-out;
}


/* =====================================================
   MOVIMIENTO DE LOS ANIMALES
===================================================== */

@keyframes nadarAnimal1 {

    0% {
        transform:
            translate(0, 0)
            rotate(-3deg);
    }

    25% {
        transform:
            translate(10px, -7px)
            rotate(2deg);
    }

    50% {
        transform:
            translate(2px, 6px)
            rotate(-2deg);
    }

    75% {
        transform:
            translate(-8px, -4px)
            rotate(2deg);
    }

    100% {
        transform:
            translate(0, 0)
            rotate(-3deg);
    }

}


@keyframes nadarAnimal2 {

    0% {
        transform:
            translate(0, 0)
            rotate(1deg);
    }

    50% {
        transform:
            translate(-15px, 8px)
            rotate(-3deg);
    }

    100% {
        transform:
            translate(0, 0)
            rotate(1deg);
    }

}


@keyframes nadarAnimal3 {

    0% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(-12px)
            rotate(4deg);
    }

    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }

}


@keyframes nadarAnimal4 {

    0% {
        transform:
            translate(0, 0)
            rotate(-1deg);
    }

    50% {
        transform:
            translate(12px, -9px)
            rotate(3deg);
    }

    100% {
        transform:
            translate(0, 0)
            rotate(-1deg);
    }

}


@keyframes nadarAnimal5 {

    0% {
        transform:
            translate(0, 0)
            rotate(-3deg);
    }

    50% {
        transform:
            translate(-18px, 7px)
            rotate(3deg);
    }

    100% {
        transform:
            translate(0, 0)
            rotate(-3deg);
    }

}


/* =====================================================
   SUPERFICIE DEL AGUA
===================================================== */

.superficie {

    position: absolute;

    top: -12px;
    left: -5%;

    width: 110%;
    height: 30px;

    background:
        linear-gradient(
            to bottom,
            rgba(210,250,255,0.9),
            rgba(70,200,240,0.8)
        );

    border-radius: 50%;

    box-shadow:
        0 5px 15px rgba(255,255,255,0.45);

    animation:
        oleaje
        4s
        infinite
        ease-in-out;

    z-index: 8;
}


@keyframes oleaje {

    0% {
        transform:
            translateX(-2%)
            scaleY(1);
    }

    50% {
        transform:
            translateX(2%)
            scaleY(1.25);
    }

    100% {
        transform:
            translateX(-2%)
            scaleY(1);
    }

}


/* =====================================================
   🦈 ALETA DEL TIBURÓN
===================================================== */

.aleta {

    position: absolute;

    left: -130px;
    top: 38%;

    width: 110px;
    height: 85px;

    z-index: 12;

    animation:
        nadar
        11s
        infinite
        linear;

}


/* CUERPO PRINCIPAL DE LA ALETA */

.aleta::before {

    content: "";

    position: absolute;

    left: 25px;
    bottom: 12px;

    width: 48px;
    height: 65px;

    background:
        linear-gradient(
            115deg,
            #0b334b 0%,
            #155978 45%,
            #082d44 100%
        );

    clip-path: polygon(
        0% 100%,
        20% 72%,
        40% 42%,
        57% 8%,
        68% 0%,
        72% 15%,
        73% 38%,
        82% 67%,
        100% 100%
    );

    border-radius: 45% 55% 20% 20%;

    box-shadow:
        inset -8px 0 10px rgba(0,0,0,0.28),
        inset 7px 0 8px rgba(255,255,255,0.08);

}


/* BRILLO DE LA ALETA */

.aleta::after {

    content: "";

    position: absolute;

    left: 42px;
    bottom: 32px;

    width: 6px;
    height: 42px;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0.25),
            rgba(255,255,255,0)
        );

    border-radius: 50%;

    transform: rotate(20deg);

}


/* =====================================================
   ESTELA DE LA ALETA
===================================================== */

.aleta-estela {

    position: absolute;

    left: -150px;
    top: 44%;

    width: 95px;
    height: 13px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(210,250,255,0.5),
            rgba(100,210,240,0.15),
            transparent 70%
        );

    z-index: 11;

    animation:
        nadarEstela
        11s
        infinite
        linear;

    filter: blur(2px);
}


@keyframes nadar {

    0% {

        left: -130px;

        transform:
            translateY(0)
            rotate(-2deg);

    }

    15% {

        transform:
            translateY(-7px)
            rotate(1deg);

    }

    30% {

        transform:
            translateY(4px)
            rotate(-1deg);

    }

    45% {

        transform:
            translateY(-6px)
            rotate(2deg);

    }

    60% {

        transform:
            translateY(5px)
            rotate(-2deg);

    }

    75% {

        transform:
            translateY(-4px)
            rotate(1deg);

    }

    100% {

        left: 110%;

        transform:
            translateY(0)
            rotate(-2deg);

    }

}


@keyframes nadarEstela {

    0% {

        left: -160px;

        opacity: 0;

        transform:
            scaleX(0.5);

    }

    15% {

        opacity: 0.6;

    }

    50% {

        opacity: 0.35;

        transform:
            scaleX(1.3);

    }

    100% {

        left: 110%;

        opacity: 0;

        transform:
            scaleX(0.7);

    }

}


/* =====================================================
   BURBUJAS
===================================================== */

.burbuja {

    position: absolute;

    bottom: -30px;

    width: 10px;
    height: 10px;

    border:
        2px solid
        rgba(255,255,255,0.6);

    border-radius: 50%;

    animation:
        subirBurbuja
        7s
        infinite
        ease-in;
}


.burbuja1 {
    left: 15%;
    animation-delay: 1s;
}


.burbuja2 {

    left: 35%;

    width: 7px;
    height: 7px;

    animation-delay: 3s;
}


.burbuja3 {

    left: 65%;

    width: 13px;
    height: 13px;

    animation-delay: 0s;
}


.burbuja4 {

    left: 85%;

    width: 6px;
    height: 6px;

    animation-delay: 4s;
}


@keyframes subirBurbuja {

    0% {

        transform:
            translateY(0);

        opacity: 0;

    }

    20% {

        opacity: 0.8;

    }

    100% {

        transform:
            translateY(-55vh);

        opacity: 0;

    }

}


/* =====================================================
   ALGAS
===================================================== */

.alga {

    position: absolute;

    bottom: 0;

    width: 12px;
    height: 90px;

    background:
        linear-gradient(
            to right,
            #075c42,
            #0b8a60,
            #064d39
        );

    border-radius:
        50% 50% 0 0;

    transform-origin:
        bottom;

    animation:
        algaMovimiento
        3s
        infinite
        ease-in-out;

    z-index: 7;
}


.alga1 {

    left: 10%;
    height: 80px;

}


.alga2 {

    left: 18%;
    height: 120px;

    animation-delay: 1s;

}


.alga3 {

    right: 15%;
    height: 100px;

    animation-delay: 0.5s;

}


.alga4 {

    right: 8%;
    height: 70px;

    animation-delay: 1.5s;

}


@keyframes algaMovimiento {

    0% {
        transform: rotate(-5deg);
    }

    50% {
        transform: rotate(8deg);
    }

    100% {
        transform: rotate(-5deg);
    }

}


/* =====================================================
   CONTENEDOR PRINCIPAL
===================================================== */

.contenedor {

    position: relative;

    z-index: 20;

    margin: 0 auto;

    padding-top: 15vh;

    width: 90%;
    max-width: 700px;

    animation:
        aparecer
        2s
        ease;

}


@keyframes aparecer {

    from {

        opacity: 0;

        transform:
            scale(.7);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* =====================================================
   TÍTULO
===================================================== */

h1 {

    color: white;

    text-shadow:
        0 3px 8px
        rgba(40,120,170,0.35);

}


/* =====================================================
   TEXTO
===================================================== */

p {

    color: white;

    font-size: 18px;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,0.15);

}


/* =====================================================
   BOTONES
===================================================== */

button {

    background: #8ed8ff;

    border: none;

    padding: 15px 30px;

    margin: 10px;

    border-radius: 30px;

    font-size: 18px;

    color: white;

    cursor: pointer;

    box-shadow:
        0 5px 15px
        rgba(80,180,230,0.45);

    transition:
        transform 0.3s,
        background 0.3s;

}


button:hover {

    transform:
        scale(1.1);

    background:
        #65c7f5;

}


/* =====================================================
   MENÚ
===================================================== */

.menu {

    display: none;

    position: relative;

    z-index: 20;

    padding-top: 15vh;

    width: 90%;

    max-width: 700px;

    margin: auto;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 600px) {

    h1 {
        font-size: 28px;
    }

    p {
        font-size: 16px;
    }

    button {
        font-size: 16px;
        padding: 12px 24px;
    }

    .nube {
        font-size: 38px;
    }

    .animal1 {
        width: 95px;
    }

    .animal2 {
        width: 110px;
    }

    .animal3 {
        width: 85px;
    }

    .animal4 {
        width: 100px;
    }

    .animal5 {
        width: 75px;
    }

}


/* =====================================================
   MENSAJE
===================================================== */

#mensaje {

    color: white;

}

</style>

</head>


<body>


<!-- =====================================================
     CIELO
===================================================== -->

<div class="cielo">

    <div class="nube nube1">
        ☁️
    </div>

    <div class="nube nube2">
        ☁️
    </div>

    <div class="nube nube3">
        ☁️
    </div>

</div>


<!-- =====================================================
     PANTALLA PRINCIPAL
===================================================== -->

<div class="contenedor" id="inicio">

    <h1>
        💗 Para mi cielo 💗
    </h1>

    <p>
        ¿Quieres ver lo que preparé para ti? :3 ☁️
    </p>

    <button onclick="entrar()">
        Sí 💗
    </button>

    <button onclick="no()">
        No 💔
    </button>

    <p id="mensaje"></p>

</div>


<!-- =====================================================
     MENÚ
===================================================== -->

<div class="menu" id="menu">

    <h1>
        Bienvenida, mi niña hermosa 💗
    </h1>

    <p>
        Escoge un apartado :3 💗
    </p>

    <button>
        💌 Carta para ti
    </button>

    <button>
        🎵 Canciones
    </button>

    <button>
        📸 Nuestros momentos
    </button>

    <button>
        💗 Carta final
    </button>

</div>


<!-- =====================================================
     MAR
===================================================== -->

<div class="mar">


    <!-- =================================================
         ANIMALES
    ================================================== -->

    <img
        src="imagenes/manta-ray-gliding-gracefully-through-clear-ocean-vector-54488792.avif"
        class="animal-mar animal1"
        alt="Mantarraya"
    >


    <img
        src="imagenes/shark_PNG18832.png"
        class="animal-mar animal2"
        alt="Tiburón"
    >


    <img
        src="imagenes/stingray-marine-life-animal-free-png.webp"
        class="animal-mar animal3"
        alt="Mantarraya"
    >


    <img
        src="imagenes/manta-ray-gliding-gracefully-through-clear-ocean-vector-54488792.avif"
        class="animal-mar animal4"
        alt="Mantarraya"
    >


    <img
        src="imagenes/sweet-cute-simple-shark-clipart-vector.jpg"
        class="animal-mar animal5"
        alt="Tiburón"
    >


    <!-- =================================================
         SUPERFICIE
    ================================================== -->

    <div class="superficie"></div>


    <!-- =================================================
         ALETA
    ================================================== -->

    <div class="aleta"></div>

    <div class="aleta-estela"></div>


    <!-- =================================================
         BURBUJAS
    ================================================== -->

    <div class="burbuja burbuja1"></div>

    <div class="burbuja burbuja2"></div>

    <div class="burbuja burbuja3"></div>

    <div class="burbuja burbuja4"></div>


    <!-- =================================================
         ALGAS
    ================================================== -->

    <div class="alga alga1"></div>

    <div class="alga alga2"></div>

    <div class="alga alga3"></div>

    <div class="alga alga4"></div>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

function entrar() {

    document.getElementById("inicio").style.display = "none";

    document.getElementById("menu").style.display = "block";

}


function no() {

    document.getElementById("mensaje").innerHTML =
        "Ándale será bonito 💙<br>" +
        "<button onclick='entrar()'>Ver sorpresa ☁️</button>";

}

</script>


</body>
</html>


</body>
</html>
